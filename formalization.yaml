      note: "Namespaced implementation theorem used by the global Comparator declaration; it is not a second selected Comparator theorem. Its substantive proof is in the pinned `MarshallHall` source modules."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.rank_freeProduct_eq_add"
      module: "MarshallHall.lean"
      status: "proved"
      note: "Substantive arbitrary-factor implementation theorem in the pinned source snapshot; the focused wrapper exposes it through the namespaced theorem above."
